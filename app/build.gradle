apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.gitls.uploader"
    compileSdkVersion 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.gitls.uploader"
        minSdkVersion 23
        targetSdkVersion 36
        def code = project.hasProperty("versionCode") ? Integer.parseInt(project.property("versionCode").toString()) : 1
        def name = project.hasProperty("versionName") ? project.property("versionName").toString() : "1.0.0"
        versionCode code
        versionName name
    }

    signingConfigs {
        release {
            def storePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    // Pembuatan keystore (sertifikat X.509 + PKCS12)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    // Enkripsi GitHub Secrets (libsodium sealed box)
    implementation 'com.goterl:lazysodium-android:5.1.0@aar'
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}
