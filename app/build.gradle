apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.example.aidetest"

    buildFeatures {
        buildConfig true
    }
    compileSdkVersion 36

    defaultConfig {
        // Public applicationId for Play Store / distribution.
        // Internal Kotlin package remains com.example.aidetest for this build
        // to avoid a massive rename; change namespace + all package declarations later.
        applicationId "com.gitls.app"
        minSdkVersion 23
        targetSdkVersion 36
        def configuredVersionCode = project.hasProperty("versionCode")
                ? Integer.parseInt(project.property("versionCode").toString())
                : 86
        def configuredVersionName = project.hasProperty("versionName")
                ? project.property("versionName").toString()
                : "2.44.12"

        versionCode configuredVersionCode
        versionName configuredVersionName

        def repo = (project.findProperty("githubRepository") ?: "OWNER/REPO").toString().replace("\\", "\\\\").replace("\"", "\\\"")
        buildConfigField "String", "GITHUB_REPOSITORY", "\"${repo}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // TEST BUILD: prefer CI environment values when present; otherwise use the
            // bundled signing/keystore.properties file so GitHub Actions needs no Secrets.
            def localSigningFile = rootProject.file("signing/keystore.properties")
            def signingProps = new Properties()
            if (localSigningFile.exists()) {
                localSigningFile.withInputStream { signingProps.load(it) }
            }

            def envStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            def localStorePath = signingProps.getProperty("storeFile")
            def storePath = envStorePath ?: localStorePath
            def storePasswordValue = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: signingProps.getProperty("storePassword")
            def keyAliasValue = System.getenv("ANDROID_KEY_ALIAS") ?: signingProps.getProperty("keyAlias")
            def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD") ?: signingProps.getProperty("keyPassword")

            // Uploader (GITLS Updater / GitHub Publisher) menyaring file *.keystore, dan workflow
            // lama (mis. build.yml) tidak memulihkannya. Pulihkan di sini, sehingga APAPUN workflow
            // yang menjalankan Gradle tetap menemukan keystore TEST yang sama (byte-identik).
            // Hanya berlaku untuk keystore bawaan repo, bukan untuk ANDROID_KEYSTORE_PATH (secrets).
            if (storePath && envStorePath == null) {
                def bundledStore = rootProject.file(storePath)
                def bundledB64 = rootProject.file(storePath + ".b64")
                if (!bundledStore.exists() && bundledB64.exists()) {
                    bundledStore.parentFile.mkdirs()
                    bundledStore.bytes = java.util.Base64.getMimeDecoder().decode(bundledB64.text.trim())
                    logger.lifecycle("Keystore TEST dipulihkan dari ${bundledB64.name}")
                }
            }

            if (storePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile rootProject.file(storePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            } else {
                throw new GradleException("Release signing configuration is incomplete. Expected signing/keystore.properties or ANDROID_KEYSTORE_* environment variables.")
            }
        }
    }

    buildTypes {
        debug {
            // Test build: debug & release use the same stable key so repeated installs/updates
            // from this test branch keep the same Android signing identity.
            signingConfig signingConfigs.release
        }
        release {
            // R8 aktif untuk menghapus bytecode/resource yang benar-benar tidak digunakan.
            // Jangan blanket-keep seluruh package aplikasi: fitur tetap dilindungi oleh
            // referensi kode/manifest dan aturan minimum di proguard-rules.pro.
            // SourceFile/LineNumberTable tetap dipertahankan agar stack trace release terbaca.
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Keep Java and Kotlin bytecode targets aligned with the JDK used by AGP 8.x.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Lint tetap dijalankan di CI dan hasil lengkapnya diunggah sebagai artifact.
    // Error lama di project tidak memblokir proses build APK; error baru tetap terlihat di report.
    lint {
        abortOnError false
        warningsAsErrors false
        checkReleaseBuilds false
    }
}

// Configure Kotlin at the project extension level. This is the supported
// Kotlin 2.2+ DSL and avoids the removed/deprecated android.kotlinOptions DSL.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")
    }
}

// Keep Java compilation deterministic across GitHub Actions and local IDEs.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.work:work-runtime:2.10.2'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.airbnb.android:lottie:6.6.7'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
