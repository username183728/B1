name: Android Build Test

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Preflight repository
        run: ./scripts/ci/preflight.sh

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace -PgithubRepository=${{ github.repository }} assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace -PgithubRepository=${{ github.repository }} testDebugUnitTest

      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace -PgithubRepository=${{ github.repository }} lint

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace -PgithubRepository=${{ github.repository }} assembleRelease

      - name: Verify debug APK is installable
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          test "$(file -b --mime-type "$apk")" = "application/vnd.android.package-archive"
          ${ANDROID_HOME}/build-tools/$(ls -1 ${ANDROID_HOME}/build-tools | sort -V | tail -n 1)/apksigner verify --verbose "$apk"
          unzip -t "$apk" >/dev/null

      - name: Verify release APK and detect signing state
        id: release_verify
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          test "$(file -b --mime-type "$apk")" = "application/vnd.android.package-archive"
          unzip -t "$apk" >/dev/null
          if ${ANDROID_HOME}/build-tools/$(ls -1 ${ANDROID_HOME}/build-tools | sort -V | tail -n 1)/apksigner verify --verbose "$apk"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo 'Release APK is unsigned; it will not be published as an installable release artifact.'
          fi

      - name: Prepare installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          cp "$apk" app/build/outputs/apk/debug/GITLS-installable-debug.apk

      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-installable-debug-apk
          path: app/build/outputs/apk/debug/GITLS-installable-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed release APK
        if: success() && steps.release_verify.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain unsigned release
        if: success() && steps.release_verify.outputs.signed != 'true'
        run: echo 'Release build succeeded but is unsigned. Use the installable debug artifact for device testing or configure ANDROID_KEYSTORE_* secrets for a signed release.' 

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-ci-diagnostics
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
