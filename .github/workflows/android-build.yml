name: Android Build Test

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Make CI scripts executable
        run: chmod +x ./scripts/ci/preflight.sh ./gradlew

      - name: Restore bundled test keystore from base64 (if filtered by uploader)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s signing/gitls-test.keystore ] && [ -s signing/gitls-test.keystore.b64 ]; then
            base64 -d signing/gitls-test.keystore.b64 > signing/gitls-test.keystore
            echo "48a14ba5119beb41c572ffbcd3b68477a761642adf5790020ea365b79db2028d  signing/gitls-test.keystore" | sha256sum -c -
            echo "Keystore TEST dipulihkan dari .b64 (identik dengan aslinya)."
          fi

      - name: Preflight repository
        run: bash ./scripts/ci/preflight.sh

      - name: Validate bundled test signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -s signing/gitls-test.keystore
          test -s signing/keystore.properties
          grep -q '^storeFile=signing/gitls-test.keystore$' signing/keystore.properties
          grep -q '^storePassword=gitls-test-2026$' signing/keystore.properties
          grep -q '^keyAlias=gitls-test$' signing/keystore.properties
          grep -q '^keyPassword=gitls-test-2026$' signing/keystore.properties
          echo "Bundled TEST keystore: OK"

      - name: Ensure Android SDK platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Show and verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          java -version 2>&1 | grep -q 'version "17\.'
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"
          echo "Android SDK API 36: OK"
          echo "Android Build Tools 35.0.0: OK"
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace help

      - name: Hitung versi build
        shell: bash
        run: |
          set -euo pipefail
          echo "APP_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=2.44.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace -PgithubRepository=${{ github.repository }} -PversionCode=$APP_VERSION_CODE -PversionName=$APP_VERSION_NAME assembleDebug

      - name: Prepare installable debug APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" app/build/outputs/apk/debug/GITLS-installable-debug.apk

      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GITLS-installable-debug-apk
          path: app/build/outputs/apk/debug/GITLS-installable-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace -PgithubRepository=${{ github.repository }} testDebugUnitTest

      - name: Run lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace -PgithubRepository=${{ github.repository }} lint

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace -PgithubRepository=${{ github.repository }} -PversionCode=$APP_VERSION_CODE -PversionName=$APP_VERSION_NAME assembleRelease

      - name: Verify debug APK is installable
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          test "$(file -b --mime-type "$apk")" = "application/vnd.android.package-archive"
          ${ANDROID_HOME}/build-tools/$(ls -1 ${ANDROID_HOME}/build-tools | sort -V | tail -n 1)/apksigner verify --verbose "$apk"
          unzip -t "$apk" >/dev/null

      - name: Verify release APK signing
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          test "$(file -b --mime-type "$apk")" = "application/vnd.android.package-archive"
          unzip -t "$apk" >/dev/null
          ${ANDROID_HOME}/build-tools/$(ls -1 ${ANDROID_HOME}/build-tools | sort -V | tail -n 1)/apksigner verify --verbose "$apk"
          echo "Release APK signing: OK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: GITLS-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GITLS-ci-diagnostics
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GITLS-lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
